[project]
name = "ai-agent-system"
version = "0.1.0"
description = "Standalone Python multi-agent AI system for A/B-test hypothesis generation on lead-gen landing pages"
requires-python = ">=3.11"
authors = [{name = "Komatozische"}]
license = {text = "Proprietary"}

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Validation / settings
    "pydantic>=2.5",
    "pydantic-settings>=2.5",

    # AI / Agents (confirmed — N5 will deepen)
    "langgraph>=0.2.50",
    "pydantic-ai>=0.0.14",
    "openai>=1.50",  # used з base_url override → OpenRouter (per N10)

    # Browser & extraction (confirmed by N1 research)
    "firecrawl-py>=4.23",  # verified PyPI v4.23.0 квітень 2026
    "selectolax>=0.3.21",  # Lexbor backend, 5-30× faster than BeautifulSoup
    "wappalyzer>=0.2",     # s0md3v/wappalyzer-next — only maintained option
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",

    # Knowledge / RAG (N3 research will refine)
    "python-frontmatter>=1.1",
    "watchdog>=5.0",
    # NOTE: GitPython removed per N8 research (70MB + Windows file handle leaks).
    # Vault git operations використовують subprocess + system git instead.
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "PyYAML>=6.0",  # llm_routing.yml + future configs

    # Hypothesis builder + state machine (per N7 research)
    "python-statemachine>=2.5",  # NOT `transitions` — N7 strong signal
    "Jinja2>=3.1",  # Pydantic model → readable Markdown templates

    # DB
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",  # modern psycopg3, not psycopg2
    "alembic>=1.13",

    # HTTP / resilience
    "httpx>=0.27",
    "tenacity>=9.0",
    "aiolimiter>=1.1",

    # Tracing (N10 will refine)
    "langsmith>=0.1.140",

    # Image processing (SoM badge rendering — N2)
    "pillow>=10.4",

    # Util
    "loguru>=0.7",
    "rich>=13.9",
    "typer>=0.12",  # CLI for benchmark/migration scripts
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",       # httpx mocking
    "vcrpy>=6.0",        # LLM cassette recording
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

benchmark = [
    "promptfoo",  # OR self-rolled — N9 will decide
    "matplotlib>=3.9",
    "plotly>=5.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "T20",
    "RET", "SIM", "RUF",
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["firecrawl.*", "wappalyzer.*", "presidio_analyzer.*", "presidio_anonymizer.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=ai_agent_system",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "integration: integration tests (use Testcontainers)",
    "agent_quality: golden snapshot agent quality tests",
    "e2e: end-to-end tests (real LLM calls — gated)",
    "slow: tests that take >10s",
]
